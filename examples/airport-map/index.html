<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%232d6cdf%27 d=%27M12 1.5l1.6 7 7.4 4.3v2.1l-7.4-2-.4 5.4 2.3 1.8v1.6L12 20.8l-3.5.9v-1.6l2.3-1.8-.4-5.4-7.4 2v-2.1l7.4-4.3z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #111; color: #ddd; }
  #map { position: absolute; inset: 0 320px 0 0; }
  #side { position: absolute; top: 0; right: 0; bottom: 0; width: 320px; overflow-y: auto; box-sizing: border-box;
          padding: 12px; background: #1b1d21; border-left: 1px solid #333; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #999; margin: 16px 0 6px; }
  form { display: flex; gap: 6px; }
  select { background: #0d0e10; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; }
  #rInfo b { color: #ff7ae6; }
  input[type=text] { flex: 1; min-width: 0; background: #0d0e10; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; text-transform: uppercase; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  button.secondary { background: #3a3d44; }
  #status { margin-top: 6px; color: #aaa; min-height: 1.4em; }
  #status.err { color: #ff6b6b; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 18px; height: 4px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
  label.opt { display: block; margin: 4px 0; }
  .note { color: #999; font-size: 12px; }
  .warn { color: #ffb347; }
  .leaflet-popup-content { font: 12px/1.45 ui-monospace, monospace; }
  .leaflet-popup-content b { font-family: system-ui, sans-serif; }
  .ac { width: 26px; height: 26px; }
  .ac svg { width: 26px; height: 26px; filter: drop-shadow(0 0 2px #000); }
  .lbl { background: none; border: 0; box-shadow: none; color: #ffe066; font: 700 11px system-ui; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .lbl::before { display: none; }
  @media (max-width: 700px) {
    #map { inset: 0 0 45% 0; }
    #side { top: 55%; width: 100%; border-left: 0; border-top: 1px solid #333; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="side">
  <h1>Airport Map</h1>
  <form id="f">
    <input type="text" id="icao" placeholder="ICAO" maxlength="8" autocomplete="off">
    <button>Load</button>
    <button type="button" class="secondary" id="refresh" title="Fetch again from the simulator">↻</button>
  </form>
  <div id="status"></div>

  <h2>Airport</h2>
  <div id="info" class="note">—</div>

  <h2>Departure route</h2>
  <div class="note">Click a parking spot, then pick a runway end.</div>
  <table>
    <tr><td>From</td><td class="n" id="rFrom">—</td></tr>
    <tr><td>To runway</td><td class="n"><select id="rTo"></select></td></tr>
  </table>
  <label class="opt"><input type="checkbox" id="rRwyPaths"> Allow taxiing on runway paths</label>
  <div id="rInfo" class="note"></div>
  <label class="opt"><input type="checkbox" id="overlaps" checked> Highlight overlapping stands</label>
  <div id="overlapInfo" class="note"></div>

  <h2>Live traffic</h2>
  <label class="opt"><input type="checkbox" id="trafficOn" checked> Show aircraft within 20 km</label>
  <table id="trafficTable" class="note"></table>

  <h2>Taxi paths by TYPE</h2>
  <table id="pathTypes"></table>

  <h2>Taxi points by TYPE</h2>
  <table id="pointTypes"></table>

  <h2>Options</h2>
  <label class="opt"><input type="checkbox" id="labels" checked> Taxiway name labels</label>
  <label class="opt"><input type="checkbox" id="follow"> Follow aircraft</label>
  <div id="acInfo" class="note">Aircraft: —</div>
</div>

<script>
const PATH_TYPES = {
  0: ['NONE', '#666'], 1: ['TAXI', '#f5b700'], 2: ['RUNWAY', '#bbbbbb'], 3: ['PARKING', '#3fa7ff'],
  4: ['PATH', '#2ecc71'], 5: ['CLOSED', '#e74c3c'], 6: ['VEHICLE', '#b07cd8'], 7: ['ROAD', '#8d99a6'], 8: ['PAINTEDLINE', '#f0f0f0'],
};
const POINT_TYPES = {
  0: ['NONE', '#777'], 1: ['NORMAL', '#cfd8dc'], 2: ['HOLD_SHORT', '#ff3b3b'], 3: ['(3)', '#ff9f1a'],
  4: ['ILS_HOLD_SHORT', '#ff00cc'], 5: ['HOLD_SHORT_NO_DRAW', '#ff8080'], 6: ['ILS_HOLD_SHORT_NO_DRAW', '#ff80e6'],
};
const HOLD_SHORT = new Set([2, 4, 5, 6]);
// TAXI_PARKING NAME enum as in the BGL spec — shown as a best guess, raw value alongside.
const PARKING_NAMES = ['', 'P', 'N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW', 'GATE', 'DOCK'];
const RWY_DESIG = ['', 'L', 'R', 'C', 'W', 'A', 'B'];
const RWY_COMPASS = { 37: 'N', 38: 'NE', 39: 'E', 40: 'SE', 41: 'S', 42: 'SW', 43: 'W', 44: 'NW' };

const $ = (id) => document.getElementById(id);
const renderer = L.canvas({ padding: 0.5, tolerance: 4 });
const map = L.map('map', { preferCanvas: true, zoomControl: true, maxZoom: 21 }).setView([50.1, 14.26], 14);

const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 21, maxNativeZoom: 19, attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 21, maxNativeZoom: 19, attribution: 'Imagery &copy; Esri',
});

const groups = {
  runways: L.layerGroup(),
  parking: L.layerGroup(),
  points: L.layerGroup(),
  hold: L.layerGroup(),
  labels: L.layerGroup(),
  overlaps: L.layerGroup(),
  route: L.layerGroup(),
};
const pathGroups = {};
for (const t of Object.keys(PATH_TYPES)) pathGroups[t] = L.layerGroup();

const overlays = {
  'Runways': groups.runways,
  'Parking spots': groups.parking,
  'Taxi points': groups.points,
  'Hold-short points': groups.hold,
};
for (const [t, [name, color]] of Object.entries(PATH_TYPES)) {
  overlays[`<span class="sw" style="background:${color}"></span>Path ${t} ${name}`] = pathGroups[t];
}
L.control.layers({ 'OpenStreetMap': osm, 'Satellite (Esri)': sat }, overlays, { collapsed: true }).addTo(map);
for (const g of [groups.runways, groups.parking, groups.hold, groups.labels, groups.overlaps, groups.route]) g.addTo(map);
for (const t of [1, 2, 3, 4, 5]) pathGroups[t].addTo(map);

let data = null;

// Offset in meters (east, north) from a lat/lon — local flat-earth approximation.
function offset(lat, lon, east, north) {
  const R = 6378137;
  return [lat + (north / R) * 180 / Math.PI, lon + (east / (R * Math.cos(lat * Math.PI / 180))) * 180 / Math.PI];
}
function dist(a, b) {
  const R = 6378137, toR = Math.PI / 180;
  const x = (b[1] - a[1]) * toR * Math.cos((a[0] + b[0]) / 2 * toR), y = (b[0] - a[0]) * toR;
  return Math.hypot(x, y) * R;
}
function rwyEnd(num, des) {
  const n = RWY_COMPASS[num] || (num > 0 ? String(num).padStart(2, '0') : '?');
  return n + (RWY_DESIG[des] || '');
}
function parkingLabel(p) {
  let prefix = PARKING_NAMES[p.name];
  if (prefix === undefined) prefix = p.name >= 12 && p.name <= 37 ? String.fromCharCode(65 + p.name - 12) : `?${p.name}`;
  if (prefix === 'GATE' || prefix === 'P') prefix = '';
  return prefix + p.number + (p.suffix >= 12 && p.suffix <= 37 ? String.fromCharCode(65 + p.suffix - 12) : '');
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function kv(obj) { return Object.entries(obj).map(([k, v]) => `${k}: ${esc(v)}`).join('<br>'); }

function pointLL(i) { const p = data.taxiPoints[i]; return p ? [p.lat, p.lon] : null; }
function parkingLL(i) { const p = data.parking[i]; return p ? [p.lat, p.lon] : null; }

// Resolves a path's endpoints: START is a taxi point; END is a taxi point,
// or a parking spot for TYPE=3 (PARKING) paths (verified on LKPR, see #247).
function endpoints(path) {
  const a = pointLL(path.start);
  const b = path.type === 3 ? parkingLL(path.end) : pointLL(path.end);
  return [a, b];
}

function drawPaths() {
  for (const g of Object.values(pathGroups)) g.clearLayers();
  groups.labels.clearLayers();
  if (!data) return;
  const labelled = new Set();
  let unresolved = 0;
  for (const p of data.taxiPaths) {
    const [a, b] = endpoints(p);
    const [tname, color] = PATH_TYPES[p.type] || [`(${p.type})`, '#ff00ff'];
    const name = data.taxiNames[p.nameIndex] || '';
    const pop = `<b>Taxi path #${p.index}</b><br>` + kv({
      type: `${p.type} ${tname}`, start: p.start, end: p.end, width: p.width.toFixed(1) + ' m',
      nameIndex: `${p.nameIndex} "${name}"`, runway: p.type === 2 ? rwyEnd(p.runwayNumber, p.runwayDesignator) : '—',
      length: a && b ? dist(a, b).toFixed(0) + ' m' : 'unresolved',
    });
    const group = pathGroups[p.type] || pathGroups[0];
    if (!a || !b) {
      unresolved++;
      const at = a || b;
      if (at) L.circleMarker(at, { renderer, radius: 5, color: '#ff00ff', weight: 2, fill: false }).bindPopup(pop).addTo(group);
      continue;
    }
    L.polyline([a, b], {
      renderer, color, weight: p.type === 2 ? 2 : 3, opacity: p.type === 5 ? 0.6 : 0.9,
      dashArray: p.type === 8 ? '4 4' : p.type === 5 ? '6 6' : null,
    }).bindPopup(pop).addTo(group);
    if ($('labels').checked && name && (p.type === 1 || p.type === 4) && !labelled.has(`${name}:${Math.round(a[0] * 400)}:${Math.round(a[1] * 400)}`)) {
      labelled.add(`${name}:${Math.round(a[0] * 400)}:${Math.round(a[1] * 400)}`);
      L.tooltip({ permanent: true, direction: 'center', className: 'lbl' })
        .setLatLng([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]).setContent(esc(name)).addTo(groups.labels);
    }
  }
  return unresolved;
}

function histogram(el, items, types, swatch) {
  const counts = {};
  for (const it of items) counts[it.type] = (counts[it.type] || 0) + 1;
  $(el).innerHTML = Object.keys(counts).sort((a, b) => a - b).map((t) => {
    const [name, color] = types[t] || [`(${t})`, '#ff00ff'];
    return `<tr><td><span class="${swatch}" style="background:${color}"></span>${t} ${name}</td><td class="n">${counts[t]}</td></tr>`;
  }).join('') || '<tr><td class="note">none</td></tr>';
}

function draw() {
  for (const g of Object.values(groups)) g.clearLayers();
  if (!data) return;

  for (const r of data.runways) {
    const h = r.heading * Math.PI / 180, hl = r.length / 2, hw = r.width / 2;
    const along = [Math.sin(h), Math.cos(h)], across = [Math.cos(h), -Math.sin(h)];
    const corner = (s, t) => offset(r.lat, r.lon, along[0] * s * hl + across[0] * t * hw, along[1] * s * hl + across[1] * t * hw);
    const name = `${rwyEnd(r.primaryNumber, r.primaryDesignator)}/${rwyEnd(r.secondaryNumber, r.secondaryDesignator)}`;
    L.polygon([corner(-1, -1), corner(1, -1), corner(1, 1), corner(-1, 1)], {
      renderer, color: '#fff', weight: 1, fillColor: '#444', fillOpacity: 0.7,
    }).bindPopup(`<b>Runway ${esc(name)}</b><br>` + kv({
      index: r.index, heading: r.heading.toFixed(1) + '°', length: r.length.toFixed(0) + ' m', width: r.width.toFixed(0) + ' m',
      primary: `${r.primaryNumber}/${r.primaryDesignator}`, secondary: `${r.secondaryNumber}/${r.secondaryDesignator}`,
    })).addTo(groups.runways);
    const ends = [[-1, rwyEnd(r.primaryNumber, r.primaryDesignator)], [1, rwyEnd(r.secondaryNumber, r.secondaryDesignator)]];
    for (const [s, label] of ends) {
      L.tooltip({ permanent: true, direction: 'center', className: 'lbl' })
        .setLatLng(offset(r.lat, r.lon, along[0] * s * (hl - 60), along[1] * s * (hl - 60))).setContent(esc(label)).addTo(groups.runways);
    }
  }

  for (const p of data.parking) {
    L.circle([p.lat, p.lon], {
      renderer, radius: Math.max(p.radius, 3), color: '#3fa7ff', weight: 1, fillOpacity: 0.15,
    }).bindPopup(`<b>Parking ${esc(parkingLabel(p))}</b><br>` + kv({
      index: p.index, name: p.name, number: p.number, type: p.type, heading: p.heading.toFixed(0) + '°',
      radius: p.radius.toFixed(1) + ' m', biasX: p.biasX.toFixed(1), biasZ: p.biasZ.toFixed(1),
    })).bindTooltip(esc(parkingLabel(p)), { direction: 'top' }).on('click', () => selectFrom(p)).addTo(groups.parking);
  }
  drawOverlaps();
  fillRunwayEnds();

  for (const p of data.taxiPoints) {
    const hold = HOLD_SHORT.has(p.type);
    const [tname, color] = POINT_TYPES[p.type] || [`(${p.type})`, '#ff00ff'];
    L.circleMarker([p.lat, p.lon], {
      renderer, radius: hold ? 5 : 2.5, color, weight: hold ? 2 : 1, fillOpacity: hold ? 0.9 : 0.6,
    }).bindPopup(`<b>Taxi point #${p.index}</b><br>` + kv({
      type: `${p.type} ${tname}`, orientation: p.orientation, biasX: p.biasX.toFixed(1), biasZ: p.biasZ.toFixed(1),
    })).addTo(hold ? groups.hold : groups.points);
  }

  const unresolved = drawPaths();
  histogram('pathTypes', data.taxiPaths, PATH_TYPES, 'sw');
  histogram('pointTypes', data.taxiPoints, POINT_TYPES, 'dot');
  $('info').innerHTML = `<b>${esc(data.icao)}</b> ${esc(data.name)}<br>` +
    `${data.runways.length} runways · ${data.parking.length} parking · ${data.taxiPoints.length} points · ` +
    `${data.taxiPaths.length} paths · ${data.taxiNames.length} names` +
    (unresolved ? `<br><span class="warn">${unresolved} paths with an out-of-range endpoint (magenta rings)</span>` : '') +
    `<br><span class="note">Fetched ${new Date(data.fetchedAt).toLocaleString()}</span>`;
  computeRoute();
}

// ── Overlapping stands ──
// Two stands overlap when their RADIUS circles intersect: both cannot hold a
// large aircraft at the same time.
function overlappingStands() {
  const pairs = [];
  const ps = data.parking.filter((p) => p.radius > 0);
  for (let i = 0; i < ps.length; i++) {
    for (let j = i + 1; j < ps.length; j++) {
      const a = ps[i], b = ps[j];
      if (dist([a.lat, a.lon], [b.lat, b.lon]) < a.radius + b.radius) pairs.push([a, b]);
    }
  }
  return pairs;
}

function drawOverlaps() {
  groups.overlaps.clearLayers();
  if (!data || !$('overlaps').checked) { $('overlapInfo').textContent = ''; return; }
  const pairs = overlappingStands();
  const stands = new Map();
  for (const [a, b] of pairs) {
    for (const [p, q] of [[a, b], [b, a]]) {
      if (!stands.has(p.index)) stands.set(p.index, { p, with: [] });
      stands.get(p.index).with.push(parkingLabel(q));
    }
  }
  for (const { p, with: others } of stands.values()) {
    L.circle([p.lat, p.lon], {
      renderer, radius: Math.max(p.radius, 3), color: '#ff9f1a', weight: 2, dashArray: '4 3', fill: false, interactive: false,
    }).addTo(groups.overlaps);
    L.circleMarker([p.lat, p.lon], { renderer, radius: 0, opacity: 0 })
      .bindTooltip(`${esc(parkingLabel(p))} overlaps ${esc(others.join(', '))}`).addTo(groups.overlaps);
  }
  $('overlapInfo').textContent = `${pairs.length} overlapping pairs, ${stands.size} stands affected.`;
}

// ── Departure route ──
let routeFrom = null;

function fillRunwayEnds() {
  const sel = $('rTo'), keep = sel.value;
  const ends = data.runways.flatMap((r) => [rwyEnd(r.primaryNumber, r.primaryDesignator), rwyEnd(r.secondaryNumber, r.secondaryDesignator)]);
  sel.innerHTML = ends.map((e) => `<option>${esc(e)}</option>`).join('');
  if (ends.includes(keep)) sel.value = keep;
}

function selectFrom(p) {
  routeFrom = p;
  $('rFrom').textContent = `${parkingLabel(p)} (#${p.index})`;
  computeRoute();
}

async function computeRoute() {
  groups.route.clearLayers();
  if (!data || !routeFrom) { $('rInfo').textContent = ''; return; }
  const to = $('rTo').value;
  $('rInfo').textContent = `Routing ${parkingLabel(routeFrom)} → ${to}…`;
  try {
    const q = new URLSearchParams({ icao: data.icao, from: routeFrom.index, to });
    if ($('rRwyPaths').checked) q.set('runwayPaths', '1');
    const res = await fetch(`/api/route?${q}`);
    if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
    const r = await res.json();
    const pts = r.points.map((p) => [p.lat, p.lon]);
    L.polyline(pts, { renderer, color: '#fff', weight: 9, opacity: 0.8, interactive: false }).addTo(groups.route);
    L.polyline(pts, { renderer, color: '#ff2bd6', weight: 5 }).addTo(groups.route);
    L.circleMarker(pts[0], { renderer, radius: 7, color: '#fff', fillColor: '#2d6cdf', fillOpacity: 1, weight: 2 }).addTo(groups.route);
    L.circleMarker(pts[pts.length - 1], { renderer, radius: 9, color: '#fff', fillColor: '#ff3b3b', fillOpacity: 1, weight: 2 })
      .bindTooltip(`Hold short ${esc(r.runwayEnd)}`, { permanent: true, direction: 'right', className: 'lbl' }).addTo(groups.route);
    const h = r.holdShort;
    $('rInfo').innerHTML =
      `<b>${esc(parkingLabel(routeFrom))} → ${esc(r.runwayEnd)}</b> · ${r.length.toFixed(0)} m<br>` +
      `Via ${r.taxiways.length ? esc(r.taxiways.join(' → ')) : '—'}<br>` +
      `Crossings: ${r.runwayCrossings.length ? esc(r.runwayCrossings.join(', ')) : 'none'}<br>` +
      (h ? `Hold short ${esc(h.name)}${h.ils ? ' (ILS)' : ''}, ${h.offset.toFixed(0)} m from centreline, taxi point #${r.nodes[r.nodes.length - 1]}` : '');
  } catch (e) {
    $('rInfo').innerHTML = `<span class="warn">${esc(e.message)}</span>`;
  }
}

// normalize flattens a pkg/airport Layout into the shape the drawing code
// uses: lat/lon on every item and the runway end fields.
function normalize(d) {
  for (const p of [...d.parking, ...d.taxiPoints]) { p.lat = p.position.lat; p.lon = p.position.lon; }
  for (const r of d.runways) {
    r.lat = r.center.lat; r.lon = r.center.lon;
    r.primaryNumber = r.primary.number; r.primaryDesignator = r.primary.designator;
    r.secondaryNumber = r.secondary.number; r.secondaryDesignator = r.secondary.designator;
  }
  return d;
}

async function load(icao, refresh) {
  icao = icao.trim().toUpperCase();
  if (!icao) return;
  $('status').className = '';
  $('status').textContent = `Loading ${icao}…`;
  try {
    const res = await fetch(`/api/airport?icao=${encodeURIComponent(icao)}${refresh ? '&refresh=1' : ''}`);
    if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
    const prev = data && data.icao;
    data = normalize(await res.json());
    if (prev !== data.icao) { routeFrom = null; $('rFrom').textContent = '—'; }
    draw();
    const pts = [...data.taxiPoints, ...data.parking].map((p) => [p.lat, p.lon]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.05));
    else map.setView([data.lat, data.lon], 14);
    $('status').textContent = '';
    history.replaceState(null, '', `?icao=${icao}`);
  } catch (e) {
    $('status').className = 'err';
    $('status').textContent = e.message;
  }
}

// ── User aircraft ──
const acIcon = (hdg) => L.divIcon({
  className: 'ac user', iconSize: [26, 26],
  html: `<svg viewBox="0 0 24 24" style="transform:rotate(${hdg}deg)"><path fill="#00e5ff" stroke="#000" stroke-width=".8" d="M12 1.5l1.6 7 7.4 4.3v2.1l-7.4-2-.4 5.4 2.3 1.8v1.6L12 20.8l-3.5.9v-1.6l2.3-1.8-.4-5.4-7.4 2v-2.1l7.4-4.3z"/></svg>`,
});
let acMarker = null;
async function pollAircraft() {
  try {
    const res = await fetch('/api/aircraft');
    if (res.status === 200) {
      const a = await res.json();
      if (!acMarker) acMarker = L.marker([a.lat, a.lon], { icon: acIcon(a.heading), zIndexOffset: 1000 }).addTo(map);
      acMarker.setLatLng([a.lat, a.lon]).setIcon(acIcon(a.heading));
      if ($('follow').checked) map.panTo([a.lat, a.lon], { animate: false });
      $('acInfo').textContent = `Aircraft: ${a.lat.toFixed(6)}, ${a.lon.toFixed(6)} · ${a.heading.toFixed(0)}° · ${a.groundKts.toFixed(0)} kt${a.onGround ? ' · on ground' : ''}`;
    } else if (acMarker) {
      acMarker.remove(); acMarker = null; $('acInfo').textContent = 'Aircraft: —';
    }
  } catch { /* server gone; keep polling */ }
}
setInterval(pollAircraft, 1000);

// ── Live traffic (every aircraft near the user) ──
const trafficLayer = L.layerGroup().addTo(map);
const trafficMarkers = new Map();
const shortState = (s) => (s || '').replace(/^STATE_/, '').toLowerCase().replace(/_/g, ' ');
const trafficIcon = (t) => L.divIcon({
  className: 'ac traffic', iconSize: [22, 22],
  html: `<svg viewBox="0 0 24 24" style="width:22px;height:22px;transform:rotate(${t.heading}deg)"><path fill="${t.onGround ? '#ffb347' : '#ff2bd6'}" stroke="#000" stroke-width=".8" d="M12 1.5l1.6 7 7.4 4.3v2.1l-7.4-2-.4 5.4 2.3 1.8v1.6L12 20.8l-3.5.9v-1.6l2.3-1.8-.4-5.4-7.4 2v-2.1l7.4-4.3z"/></svg>`,
});
const trafficLabel = (t) => `${esc(t.tail || t.objectId)} ${t.agl.toFixed(0)}ft ${t.groundKts.toFixed(0)}kt` +
  `<br>${t.vs >= 0 ? '+' : ''}${t.vs.toFixed(0)}fpm · gear ${(t.gear * 100).toFixed(0)}% · lights ${esc(t.lights || '—')} · ${esc(shortState(t.state))}`;
async function pollTraffic() {
  if (!$('trafficOn').checked) { trafficLayer.clearLayers(); trafficMarkers.clear(); $('trafficTable').innerHTML = ''; return; }
  let list = [];
  try { list = await (await fetch('/api/traffic')).json(); } catch { return; }
  const seen = new Set();
  for (const t of list) {
    if (t.user) continue;
    seen.add(t.objectId);
    let m = trafficMarkers.get(t.objectId);
    if (!m) {
      m = L.marker([t.lat, t.lon], { icon: trafficIcon(t), zIndexOffset: 900 })
        .bindTooltip('', { permanent: true, direction: 'right', offset: [10, 0], className: 'lbl' }).addTo(trafficLayer);
      trafficMarkers.set(t.objectId, m);
    }
    m.setLatLng([t.lat, t.lon]).setIcon(trafficIcon(t)).setTooltipContent(trafficLabel(t));
  }
  for (const [id, m] of trafficMarkers) if (!seen.has(id)) { m.remove(); trafficMarkers.delete(id); }
  const rows = list.filter((t) => !t.user).sort((a, b) => a.agl - b.agl);
  $('trafficTable').innerHTML = rows.length
    ? '<tr><td>tail</td><td class="n">ft</td><td class="n">kt</td><td class="n">fpm</td><td class="n">gear</td></tr>' +
      rows.map((t) => `<tr title="${esc(t.title)}"><td>${esc(t.tail || t.objectId)}<br><span class="note">${esc(shortState(t.state))}</span></td>` +
        `<td class="n">${t.agl.toFixed(0)}</td><td class="n">${t.groundKts.toFixed(0)}</td><td class="n">${t.vs.toFixed(0)}</td>` +
        `<td class="n">${(t.gear * 100).toFixed(0)}%</td></tr>`).join('')
    : '<tr><td>No other aircraft</td></tr>';
}
setInterval(pollTraffic, 1000);
$('trafficOn').addEventListener('change', pollTraffic);

// ── Wiring ──
$('f').addEventListener('submit', (e) => { e.preventDefault(); load($('icao').value); });
$('refresh').addEventListener('click', () => load($('icao').value, true));
$('labels').addEventListener('change', () => { if (data) drawPaths(); });
$('overlaps').addEventListener('change', drawOverlaps);
$('rTo').addEventListener('change', computeRoute);
$('rRwyPaths').addEventListener('change', computeRoute);
const initial = new URLSearchParams(location.search).get('icao') || 'LKPR';
$('icao').value = initial;
load(initial);
</script>
</body>
