name: Release traffic director image

# The traffic director (#710) as a linux/amd64 container image on each
# library release: ghcr.io/mrlm-net/traffic-director:<tag> and :latest.
# Built from cmd/traffic-director/Dockerfile; runs as a non-root user,
# /healthz on its HTTP address without a token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push traffic-director
    # Library releases only (vX.Y.Z), not cmd/airport-map/vX.Y.Z.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/traffic-director"
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "TAGS=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/traffic-director/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MyCrew traffic director (multiplayer)
