name: Security Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x' # the latest patch: stdlib fixes (Go 1.27.2 fixed GO-2026-6603…6617)
          cache: true

      # The traffic director ships as a Linux image (release-director.yml):
      # it must build there, not only on Windows (v0.51–0.61 images failed).
      - name: Build the traffic director for Linux
        run: go build -o /dev/null ./cmd/traffic-director
        env:
          GOOS: linux
          CGO_ENABLED: '0'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan main module
        run: govulncheck ./...
        env:
          GOOS: windows

      - name: Scan simvar-cli module
        run: govulncheck .
        working-directory: cmd/simvar-cli
        env:
          GOOS: windows

      # The map builds against the library in this checkout, not its last
      # release: through a workspace (go.work is not committed).
      - name: Workspace for the airport map
        run: go work init . ./cmd/airport-map

      - name: Scan airport-map module
        run: govulncheck .
        working-directory: cmd/airport-map
        env:
          GOOS: windows
