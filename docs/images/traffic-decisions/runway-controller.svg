<svg xmlns="http://www.w3.org/2000/svg" width="820" height="630" viewBox="0 0 820 630" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>How the runway controller clears arrivals, departures and crossings</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="820" height="630" fill="#ffffff"/>
  <g stroke="#44546a" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="260" y1="60" x2="260" y2="80"/>
    <line x1="260" y1="128" x2="260" y2="148"/>
    <line x1="490" y1="172" x2="538" y2="172"/>
    <line x1="260" y1="196" x2="260" y2="216"/>
    <line x1="490" y1="240" x2="538" y2="240"/>
    <line x1="260" y1="264" x2="260" y2="284"/>
    <line x1="260" y1="324" x2="260" y2="344"/>
    <line x1="490" y1="368" x2="538" y2="368"/>
    <line x1="260" y1="392" x2="260" y2="412"/>
    <line x1="490" y1="436" x2="538" y2="436"/>
    <line x1="260" y1="460" x2="260" y2="480"/>
    <line x1="490" y1="504" x2="538" y2="504"/>
    <line x1="260" y1="528" x2="260" y2="548"/>
  </g>
  <g font-size="12" fill="#44546a">
    <text x="498" y="166">yes</text>
    <text x="498" y="234">yes</text>
    <text x="498" y="362">yes</text>
    <text x="498" y="430">yes</text>
    <text x="498" y="498">yes</text>
    <text x="268" y="210">then</text>
    <text x="268" y="278">then</text>
    <text x="268" y="406">a departure</text>
    <text x="268" y="474">no</text>
    <text x="268" y="542">no</text>
  </g>
  <g fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.2">
    <rect x="30" y="20" width="460" height="40" rx="6"/>
    <rect x="30" y="80" width="460" height="48" rx="6"/>
    <rect x="30" y="284" width="460" height="40" rx="6"/>
    <rect x="30" y="548" width="460" height="56" rx="6"/>
  </g>
  <g fill="#fff4e0" stroke="#b7791f" stroke-width="1.2">
    <rect x="30" y="148" width="460" height="48" rx="18"/>
    <rect x="30" y="216" width="460" height="48" rx="18"/>
    <rect x="30" y="344" width="460" height="48" rx="18"/>
    <rect x="30" y="412" width="460" height="48" rx="18"/>
    <rect x="30" y="480" width="460" height="48" rx="18"/>
  </g>
  <g fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.2">
    <rect x="540" y="148" width="260" height="48" rx="6"/>
    <rect x="540" y="216" width="260" height="48" rx="6"/>
    <rect x="540" y="344" width="260" height="48" rx="6"/>
    <rect x="540" y="412" width="260" height="48" rx="6"/>
    <rect x="540" y="480" width="260" height="48" rx="6"/>
  </g>
  <g fill="#1f2933">
    <text x="44" y="45">Decide(now, users), each time it is called (the map: every second)</text>

    <text x="44" y="100">Who is on the runway (lined up, rolling); the next arrival:</text>
    <text x="44" y="117">time = distance / max(ground speed, 100 kt)</text>

    <text x="44" y="168">Someone in the way (lined up, crossing, landed, other)</text>
    <text x="44" y="185">and the next arrival 30 s or less from the threshold?</text>
    <text x="552" y="168">GoAround: the arrival</text>
    <text x="552" y="185">(Waiting: "X on the runway")</text>

    <text x="44" y="236">Nobody on the runway (a departure rolling counts), the next</text>
    <text x="44" y="253">arrival established and within 6 NM?</text>
    <text x="552" y="236">Land: the arrival</text>

    <text x="44" y="309">Ours lined up: take-off as below; then the holding points, first come</text>

    <text x="44" y="364">A crossing: runway free and the next arrival</text>
    <text x="44" y="381">at least 40 s + 30 s away?</text>
    <text x="552" y="364">Cross (one at a time: the runway</text>
    <text x="552" y="381">counts as occupied after it)</text>

    <text x="44" y="432">Runway free, interval run, no arrival inside 4 NM,</text>
    <text x="44" y="449">and the next one later than occupancy + 30 s?</text>
    <text x="552" y="432">LineUp + Takeoff</text>
    <text x="552" y="449">(line up and go)</text>

    <text x="44" y="500">Only the departure interval still runs, and the next</text>
    <text x="44" y="517">arrival later than occupancy + 30 s + 30 s?</text>
    <text x="552" y="500">LineUp (line up and wait)</text>

    <text x="44" y="568">Waiting, with the reason. The first in turn waiting only for</text>
    <text x="44" y="585">the next arrival: LineUpBehind it (a conditional line-up)</text>
  </g>
</svg>
