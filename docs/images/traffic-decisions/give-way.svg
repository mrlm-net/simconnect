<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>How a taxiing aircraft decides to stop for traffic</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="820" height="560" fill="#ffffff"/>
  <g stroke="#44546a" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="260" y1="60" x2="260" y2="80"/>
    <line x1="260" y1="128" x2="260" y2="216"/>
    <line x1="490" y1="104" x2="538" y2="104"/>
    <line x1="670" y1="128" x2="670" y2="148"/>
    <line x1="260" y1="264" x2="260" y2="284"/>
    <line x1="490" y1="240" x2="538" y2="240"/>
    <line x1="260" y1="332" x2="260" y2="352"/>
    <line x1="490" y1="308" x2="538" y2="308"/>
    <line x1="260" y1="400" x2="260" y2="420"/>
    <line x1="490" y1="376" x2="538" y2="376"/>
    <line x1="260" y1="468" x2="260" y2="488"/>
  </g>
  <g font-size="12" fill="#44546a">
    <text x="498" y="98">yes</text>
    <text x="268" y="176">then, in any case</text>
    <text x="498" y="234">no</text>
    <text x="498" y="302">yes</text>
    <text x="498" y="370">no</text>
    <text x="268" y="278">yes</text>
    <text x="268" y="346">no</text>
    <text x="268" y="414">yes</text>
  </g>
  <g fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.2">
    <rect x="30" y="20" width="460" height="40" rx="6"/>
    <rect x="30" y="420" width="460" height="48" rx="6"/>
    <rect x="30" y="488" width="460" height="48" rx="6"/>
  </g>
  <g fill="#fff4e0" stroke="#b7791f" stroke-width="1.2">
    <rect x="30" y="80" width="460" height="48" rx="18"/>
    <rect x="30" y="216" width="460" height="48" rx="18"/>
    <rect x="30" y="284" width="460" height="48" rx="18"/>
    <rect x="30" y="352" width="460" height="48" rx="18"/>
    <rect x="540" y="148" width="260" height="56" rx="18"/>
  </g>
  <g fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.2">
    <rect x="540" y="80" width="260" height="48" rx="6"/>
    <rect x="540" y="216" width="260" height="48" rx="6"/>
    <rect x="540" y="284" width="260" height="48" rx="6"/>
    <rect x="540" y="352" width="260" height="48" rx="6"/>
  </g>
  <g fill="#1f2933">
    <text x="44" y="45">Every 0.1 s while taxiing (followAhead, TrafficCheckEvery)</text>

    <text x="44" y="100">Body ahead? Another aircraft's body (nose to tail, every 5 m)</text>
    <text x="44" y="117">within my half-span of my path, in the next 200 m (blocking)</text>

    <text x="552" y="100">Stop with my nose tip 15 m</text>
    <text x="552" y="117">behind its body (TrafficGapMeters)</text>

    <text x="552" y="168">Coming the other way (≥ 120°)?</text>
    <text x="552" y="185">Stop before the last junction,</text>
    <text x="552" y="199" font-size="11">its other branches clear (junctionStop)</text>

    <text x="44" y="236">Paths meet? My path and another's reported path (≤ 250 m)</text>
    <text x="44" y="253">within both half-spans + 10 m (giveWayTo)</text>

    <text x="552" y="236">Go on</text>

    <text x="44" y="304">Already in it? The meeting point nearer than my half-span</text>
    <text x="44" y="321">(beside a push: only if inside its corridor + 3 m)</text>

    <text x="552" y="304">Go on through</text>

    <text x="44" y="372">It is a push under way, or it reaches the point first</text>
    <text x="44" y="389">(its distance + 5 m &lt; mine; a tie: the lower ID goes)?</text>

    <text x="552" y="372">I go; it gives way to me</text>

    <text x="44" y="440">I give way: stop with my nose tip 15 m short of the point</text>
    <text x="44" y="457">(the nearer of this and any body stop wins)</text>

    <text x="44" y="508">Report my path ahead, every 5 m up to my next stop (≤ 250 m),</text>
    <text x="44" y="525">for the others' decisions (ReportPath)</text>
  </g>
</svg>
